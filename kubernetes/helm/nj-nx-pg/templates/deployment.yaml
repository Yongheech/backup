apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-njnginx-deploy
  labels:
    app: helm-njnginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helm-njnginx
  template:
    metadata:
      name: helm-njnginx
      labels:
        app: helm-njnginx
    spec:
      containers:
        - name: helm-njnginx
          image: nginx
          ports:
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/nginx/conf.d
              name: nginx-config
      volumes:
        - name: nginx-config
          configMap:
            name: njnginx-config

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-nodejs-deploy
  labels:
    app: helm-nodejs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helm-nodejs
  template:
    metadata:
      name: helm-nodejs
      labels:
        app: helm-nodejs
    spec:
      containers:
        - name: helm-nodejs
          image: chkion1234/k8s-nodejs:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: DB_HOST
              value: k8s-postgre-svc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-postgre13-deploy
  labels:
    app: helm-postgre13
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helm-postgre13
  template:
    metadata:
      name: helm-postgre13
      labels:
        app: helm-postgre13
    spec:
      containers:
        - name: helm-postgre13
          image: postgres:13-alpine3.20
          ports:
            - containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: postgre-pets-secret
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgre-storage
            - mountPath: /docker-entrypoint-initdb.d
              name: initdb-script
      volumes:
        - name: postgre-storage
          emptyDir: {}
        - name: initdb-script
          configMap:
            name: pets-initdb-config

